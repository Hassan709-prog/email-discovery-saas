[project]
name = "email-discovery-saas"
version = "0.1.0"
description = "Email Discovery SaaS monorepo development tools"
requires-python = ">=3.14,<3.15"
dependencies = [
    "email-discovery-scanner",
    "email-discovery-api",
    "email-discovery-crawl-worker",
]


[tool.pytest.ini_options]
testpaths = ["packages/scanner/tests", "apps/api/tests", "workers/crawl/tests", "tests"]
pythonpath = [".", "apps/api", "workers/crawl"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["packages/scanner/src", "packages/scanner/tests", "apps/api/src", "apps/api/tests", "workers/crawl/src", "workers/crawl/tests", "tools", "tests/test_phase5c_operational_load.py"]
extraPaths = ["packages/scanner/src", "apps/api/src", "workers/crawl/src"]


[tool.uv.workspace]
members = [
    "packages/scanner",
    "apps/api",
    "workers/crawl",
]

[tool.uv.sources]
email-discovery-scanner = { workspace = true, editable = true }
email-discovery-api = { workspace = true, editable = true }
email-discovery-crawl-worker = { workspace = true, editable = true }


[dependency-groups]
dev = [
    "hypothesis>=6.165.9",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff.lint.isort]
known-first-party = ["email_scanner", "email_discovery_api", "email_discovery_crawl_worker", "tools"]
