[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-discovery-scanner"
version = "0.1.0"
description = "Independent scanner core for the Email Discovery SaaS"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tldextract>=5.3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.0",
  "ruff>=0.9",
  "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/email_scanner"]
