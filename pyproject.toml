[project]
name = "email-discovery-saas"
version = "0.1.0"
description = "Email Discovery SaaS monorepo development tools"
requires-python = ">=3.14,<3.15"
dependencies = [
    "email-discovery-scanner",
]

[tool.pytest.ini_options]
testpaths = ["packages/scanner/tests", "tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["packages/scanner/src", "packages/scanner/tests"]
extraPaths = ["packages/scanner/src"]

[tool.uv.workspace]
members = [
    "packages/scanner",
]

[tool.uv.sources]
email-discovery-scanner = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.165.9",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff.lint.isort]
known-first-party = ["email_scanner"]